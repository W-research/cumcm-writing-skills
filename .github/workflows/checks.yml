name: skill-checks
on:
  push:
  pull_request:
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s evals -p 'test_*.py' -v
      - run: python evals/check_outputs.py --responses evals/runs
      - run: python evals/check_freshness.py
